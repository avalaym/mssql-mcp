name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Only what the jobs need: read the repo. Nothing here writes back to GitHub.
permissions:
  contents: read

# New pushes to the same PR cancel the previous in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, DB-free gate: lint + repo invariants (every unit test wired into
  # `npm test`, package.json version in sync with src/constants.ts).
  lint:
    name: Lint & repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Repo invariants (test manifest, version sync)
        run: npm run check

  # Typecheck + build + unit tests across supported Node versions.
  # Unit tests run against compiled output, so a clean build is required first.
  unit:
    name: Build & unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

  # End-to-end MCP client -> server -> live SQL Server. Runs once on the
  # current LTS; the unit matrix already covers Node-version compatibility.
  integration:
    name: Integration tests (SQL Server 2022)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, unit]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'P@ssw0rd_CI_2024!' }}
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Integration tests (live SQL Server)
        run: npm run test:integration
        env:
          DB_SERVER: localhost
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD || 'P@ssw0rd_CI_2024!' }}
          DB_ENCRYPT: "true"
          DB_TRUST_SERVER_CERTIFICATE: "true"

  # Windows integrated authentication (DB_AUTH_TYPE=windows) against SQL Server
  # Express on the runner: the runner account is a Windows login with sysadmin,
  # and msnodesqlv8 (optional peer dependency) is installed only in this job.
  integration-windows:
    name: Integration tests (Windows auth, SQL Server Express)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [lint, unit]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install SQL Server Express
        shell: pwsh
        run: choco install sql-server-express -y --no-progress

      - name: Enable TCP 1433 and restart SQL Server
        shell: pwsh
        run: |
          $inst = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL').SQLEXPRESS
          $tcp = "HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\$inst\MSSQLServer\SuperSocketNetLib\Tcp"
          Set-ItemProperty $tcp -Name Enabled -Value 1
          Set-ItemProperty "$tcp\IPAll" -Name TcpDynamicPorts -Value ''
          Set-ItemProperty "$tcp\IPAll" -Name TcpPort -Value '1433'
          Restart-Service 'MSSQL$SQLEXPRESS' -Force

      - name: Pick an ODBC driver for SQL Server
        shell: pwsh
        run: |
          $names = (Get-OdbcDriver -Platform '64-bit').Name
          $driver = @('ODBC Driver 18 for SQL Server', 'ODBC Driver 17 for SQL Server') | Where-Object { $names -contains $_ } | Select-Object -First 1
          if (-not $driver) {
            choco install sqlserver-odbcdriver -y --no-progress
            $names = (Get-OdbcDriver -Platform '64-bit').Name
            $driver = @('ODBC Driver 18 for SQL Server', 'ODBC Driver 17 for SQL Server') | Where-Object { $names -contains $_ } | Select-Object -First 1
          }
          if (-not $driver) { Write-Error "No ODBC Driver 17/18 for SQL Server available: $($names -join ', ')"; exit 1 }
          "DB_ODBC_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save msnodesqlv8@^6.2.0

      - name: Build
        run: npm run build

      - name: Integration tests (live SQL Server, Windows auth)
        run: npm run test:integration
        env:
          DB_AUTH_TYPE: windows
          DB_SERVER: localhost
          DB_PORT: 1433
          DB_ENCRYPT: "true"
          DB_TRUST_SERVER_CERTIFICATE: "true"

  # Single required status check for branch protection: goes red if any job
  # above failed, was cancelled, or was skipped.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, unit, integration, integration-windows]
    steps:
      - name: Check job results
        run: |
          echo "lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} integration=${{ needs.integration.result }} integration-windows=${{ needs.integration-windows.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.integration-windows.result }}" != "success" ]; then
            echo "::error::One or more CI jobs did not succeed."
            exit 1
          fi
